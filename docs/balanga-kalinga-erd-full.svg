  <text x="184" y="1408" class="note">Legend — PK Primary key · FK Foreign key · UQ Unique · 1 = one record · M = many records. Foreign keys to <tspan font-family="Courier New, monospace">users</tspan> cascade on delete.</text>
  <text x="184" y="1430" class="note"><tspan font-family="Courier New, monospace">appointments</tspan> also has an index on (counselor_id, requested_date, requested_time, status). Types shown are MySQL 8 / InnoDB, utf8mb4.</text>

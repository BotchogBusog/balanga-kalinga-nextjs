<svg xmlns="http://www.w3.org/2000/svg" width="2540" height="1300" viewBox="0 0 2540 1300" role="img" aria-labelledby="title desc">
  <title id="title">Balanga Kalinga entity relationship diagram (simplified)</title>
  <desc id="desc">Nine-table MySQL schema for the Balanga Kalinga student wellness and counseling system.</desc>
  <style>
    .bg{fill:#fff}
    .box{stroke:#222;stroke-width:2.2}
    .head{stroke:#222;stroke-width:2.2}
    .name{font:bold 22px Arial,sans-serif;fill:#111;text-anchor:middle}
    .fld{font:18px 'Courier New',monospace;fill:#111}
    .typ{font:17px 'Courier New',monospace;fill:#444;text-anchor:end}
    .key{font-weight:bold}
    .rel{stroke:#222;stroke-width:2.4;fill:none}
    .card{font:bold 19px Arial,sans-serif;fill:#222}
    .title{font:bold 30px Arial,sans-serif;fill:#151515;text-anchor:middle}
    .sub{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}
    .note{font:14px Arial,sans-serif;fill:#444}
  </style>
  <rect class="bg" width="2540" height="1300"/>
  <text x="1270" y="52" class="title">Balanga Kalinga — Entity Relationship Diagram (Simplified)</text>
  <text x="1270" y="80" class="sub">Web-Based Student Wellness Assessment and Counseling Management System · 9 tables</text>
  <path d="M1274 370 V570 M340 570 H2208 M340 570 V640 M693 570 V640 M1038 570 V640 M1383 570 V640 M1768 570 V640 M2208 570 V640" class="rel"/>
  <text x="1288" y="550" class="card">1</text>
  <text x="354" y="630" class="card">M</text>
  <text x="707" y="630" class="card">M</text>
  <text x="1052" y="630" class="card">M</text>
  <text x="1397" y="630" class="card">M</text>
  <text x="1782" y="630" class="card">M</text>
  <text x="2222" y="630" class="card">1</text>
  <path d="M1958 790 H2058" class="rel"/>
  <text x="1968" y="778" class="card">M</text>
  <text x="2036" y="778" class="card">1</text>
  <path d="M1383 800 V1000" class="rel"/>
  <text x="1397" y="834" class="card">1</text>
  <text x="1397" y="986" class="card">M</text>

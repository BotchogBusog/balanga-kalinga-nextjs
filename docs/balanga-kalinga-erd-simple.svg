<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Balanga Kalinga simplified entity relationship diagram</title>
  <desc id="desc">A clear, print-friendly core ERD with non-crossing relationship lines.</desc>
  <style>
    .page { fill: #fff; }.title { font: bold 30px Arial, sans-serif; fill: #151515; text-anchor: middle; }.subtitle { font: 16px Arial, sans-serif; fill: #555; text-anchor: middle; }
    .box { stroke: #222; stroke-width: 1.6; }.head { stroke: #222; stroke-width: 1.6; }.entity { font: bold 18px Arial, sans-serif; fill: #111; text-anchor: middle; }.field { font: 15px 'Courier New', monospace; fill: #111; }.pk { font-weight: bold; }.rel { stroke: #222; stroke-width: 1.8; fill: none; }.card { font: bold 14px Arial, sans-serif; fill: #222; }.note { font: 14px Arial, sans-serif; fill: #444; }
  </style>
  <rect class="page" width="1800" height="1180"/>
  <text x="900" y="52" class="title">Balanga Kalinga — Simplified Entity Relationship Diagram</text>
  <text x="900" y="80" class="subtitle">Core student wellness, mood, journal, counseling, and AI companion records</text>

  <!-- Central parent table -->
  <g transform="translate(690 135)"><rect width="420" height="252" fill="#dcecd2" class="box"/><rect width="420" height="42" fill="#c4ddb5" class="head"/><text x="210" y="28" class="entity">users</text><text x="18" y="72" class="field pk">PK  id</text><text x="18" y="100" class="field">name</text><text x="18" y="128" class="field">email (UNIQUE)</text><text x="18" y="156" class="field">student_id (UNIQUE)</text><text x="18" y="184" class="field">role</text><text x="18" y="212" class="field pk">FK  counselor_id (UNIQUE)</text><text x="18" y="240" class="field">course, year_level</text></g>

  <!-- Clean trunk from users to child entities -->
  <path d="M900 387 V470 M185 470 H1615 M185 470 V560 M465 470 V560 M745 470 V560 M1025 470 V560 M1305 470 V560 M1615 470 V560" class="rel"/>
  <text x="915" y="450" class="card">1</text>
  <text x="199" y="550" class="card">M</text>
  <text x="479" y="550" class="card">M</text>
  <text x="759" y="550" class="card">M</text>
  <text x="1039" y="550" class="card">M</text>
  <text x="1319" y="550" class="card">M</text>
  <text x="1629" y="550" class="card">1</text>

  <!-- Child tables: no relationship lines cross -->
  <g transform="translate(60 560)"><rect width="250" height="224" fill="#f8d2b1" class="box"/><rect width="250" height="42" fill="#edbd92" class="head"/><text x="125" y="28" class="entity">wellness_assessments</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field pk">FK  user_id</text><text x="14" y="128" class="field">answers</text><text x="14" y="156" class="field">overall_level</text><text x="14" y="184" class="field">summary</text><text x="14" y="212" class="field">created_at</text></g>
  <g transform="translate(340 560)"><rect width="250" height="196" fill="#f8d2b1" class="box"/><rect width="250" height="42" fill="#edbd92" class="head"/><text x="125" y="28" class="entity">moods</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field pk">FK  user_id</text><text x="14" y="128" class="field">mood</text><text x="14" y="156" class="field">note</text><text x="14" y="184" class="field">created_at</text></g>
  <g transform="translate(620 560)"><rect width="250" height="196" fill="#f8d2b1" class="box"/><rect width="250" height="42" fill="#edbd92" class="head"/><text x="125" y="28" class="entity">journal_entries</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field pk">FK  user_id</text><text x="14" y="128" class="field">title</text><text x="14" y="156" class="field">content</text><text x="14" y="184" class="field">mood</text></g>
  <g transform="translate(900 560)"><rect width="250" height="168" fill="#f8d2b1" class="box"/><rect width="250" height="42" fill="#edbd92" class="head"/><text x="125" y="28" class="entity">ai_conversations</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field pk">FK  user_id</text><text x="14" y="128" class="field">title</text><text x="14" y="156" class="field">created_at</text></g>
  <g transform="translate(1180 560)"><rect width="250" height="224" fill="#f8d2b1" class="box"/><rect width="250" height="42" fill="#edbd92" class="head"/><text x="125" y="28" class="entity">appointments</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field">transaction_ref (UNIQUE)</text><text x="14" y="128" class="field pk">FK  user_id</text><text x="14" y="156" class="field pk">FK  counselor_id</text><text x="14" y="184" class="field">date, time, status</text><text x="14" y="212" class="field">created_at</text></g>
  <g transform="translate(1490 560)"><rect width="250" height="168" fill="#d9d8ef" class="box"/><rect width="250" height="42" fill="#c4c2e1" class="head"/><text x="125" y="28" class="entity">counselors</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field">name</text><text x="14" y="128" class="field">specialization</text><text x="14" y="156" class="field">is_available</text></g>

  <!-- counselors 1 : M appointments -->
  <path d="M1430 760 H1490" class="rel"/>
  <text x="1436" y="748" class="card">M</text>
  <text x="1472" y="748" class="card">1</text>

  <!-- ai_conversations 1 : M ai_messages -->
  <path d="M1025 728 V930" class="rel"/>
  <text x="1040" y="782" class="card">1</text>
  <text x="1040" y="918" class="card">M</text>

  <!-- Supporting tables -->
  <g transform="translate(900 930)"><rect width="250" height="168" fill="#f8d2b1" class="box"/><rect width="250" height="42" fill="#edbd92" class="head"/><text x="125" y="28" class="entity">ai_messages</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field pk">FK  conversation_id</text><text x="14" y="128" class="field">role</text><text x="14" y="156" class="field">content</text></g>
  <g transform="translate(60 930)"><rect width="250" height="196" fill="#e7e7e7" class="box"/><rect width="250" height="42" fill="#d4d4d4" class="head"/><text x="125" y="28" class="entity">emergency_resources</text><text x="14" y="72" class="field pk">PK  id</text><text x="14" y="100" class="field">name</text><text x="14" y="128" class="field">phone</text><text x="14" y="156" class="field">description</text><text x="14" y="184" class="field">category</text></g>

  <text x="45" y="1140" class="note">Legend: PK = Primary Key · FK = Foreign Key · 1 = one record · M = many records. Print in landscape, A3 or larger, at 100% scale.</text>
</svg>

  <g transform="translate(1233 1000)">
    <rect width="300" height="190" fill="#f8d2b1" class="box"/>
    <rect width="300" height="52" fill="#edbd92" class="head"/>
    <text x="150" y="35" class="name">ai_messages</text>
    <text x="18" y="86" class="fld key">PK  id</text>
    <text x="282" y="86" class="typ">INT</text>
    <text x="18" y="116" class="fld key">FK  conversation_id</text>
    <text x="282" y="116" class="typ">INT</text>
    <text x="18" y="146" class="fld">role</text>
    <text x="282" y="146" class="typ">VARCHAR(20)</text>
    <text x="18" y="176" class="fld">content</text>

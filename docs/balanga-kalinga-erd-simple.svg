  <g transform="translate(1111 120)">
    <rect width="326" height="250" fill="#dcecd2" class="box"/>
    <rect width="326" height="52" fill="#c4ddb5" class="head"/>
    <text x="163" y="35" class="name">users</text>
    <text x="18" y="86" class="fld key">PK  id</text>
    <text x="308" y="86" class="typ">INT</text>
    <text x="18" y="116" class="fld">name</text>
    <text x="308" y="116" class="typ">VARCHAR(120)</text>
    <text x="18" y="146" class="fld key">UQ  email</text>
    <text x="308" y="146" class="typ">VARCHAR(190)</text>
    <text x="18" y="176" class="fld key">UQ  student_id</text>
    <text x="308" y="176" class="typ">VARCHAR(40)</text>
    <text x="18" y="206" class="fld">role</text>
    <text x="308" y="206" class="typ">VARCHAR(20)</text>
    <text x="18" y="236" class="fld key">FK UQ  counselor_id</text>
    <text x="308" y="236" class="typ">INT</text>

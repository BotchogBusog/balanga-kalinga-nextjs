    <text x="282" y="116" class="typ">INT</text>
    <text x="18" y="146" class="fld">title</text>
    <text x="282" y="146" class="typ">VARCHAR(200)</text>
  </g>
  <g transform="translate(1578 640)">
    <rect width="380" height="250" fill="#f8d2b1" class="box"/>
    <rect width="380" height="52" fill="#edbd92" class="head"/>
    <text x="190" y="35" class="name">appointments</text>
    <text x="18" y="86" class="fld key">PK  id</text>
    <text x="362" y="86" class="typ">INT</text>
    <text x="18" y="116" class="fld key">UQ  transaction_ref</text>
    <text x="362" y="116" class="typ">VARCHAR(50)</text>
    <text x="18" y="146" class="fld key">FK  user_id</text>
    <text x="362" y="146" class="typ">INT</text>
    <text x="18" y="176" class="fld key">FK  counselor_id</text>
    <text x="362" y="176" class="typ">INT</text>

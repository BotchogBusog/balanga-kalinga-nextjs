  <g transform="translate(182 1000)">
    <rect width="300" height="160" fill="#e7e7e7" class="box"/>
    <rect width="300" height="52" fill="#d4d4d4" class="head"/>
    <text x="150" y="35" class="name">emergency_resources</text>
    <text x="18" y="86" class="fld key">PK  id</text>
    <text x="282" y="86" class="typ">INT</text>
    <text x="18" y="116" class="fld">name</text>
    <text x="282" y="116" class="typ">VARCHAR(120)</text>
    <text x="18" y="146" class="fld">phone</text>
    <text x="282" y="146" class="typ">VARCHAR(40)</text>
  </g>
  <text x="182" y="1258" class="note">Legend — PK Primary key · FK Foreign key · UQ Unique · 1 = one record · M = many records. Foreign keys to <tspan font-family="Courier New, monospace">users</tspan> cascade on delete.</text>
  <text x="182" y="1280" class="note"><tspan font-family="Courier New, monospace">appointments</tspan> also has an index on (counselor_id, requested_date, requested_time, status). Types shown are MySQL 8 / InnoDB, utf8mb4.</text>
</svg>

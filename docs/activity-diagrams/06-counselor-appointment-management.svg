<text x="820" y="482" class="note">Yes</text>
<path d="M800 500 L1010 567.5 L800 635 L590 567.5 Z" class="shape"/><text x="800" y="560.5" class="label">Counselor</text><text x="800" y="590.5" class="label">account?</text>

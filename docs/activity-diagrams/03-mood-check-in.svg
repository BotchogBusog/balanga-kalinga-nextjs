<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2020" viewBox="0 0 1600 2020" role="img" aria-labelledby="title desc">
<title id="title">Mood Check-In activity diagram</title>
<desc id="desc">Activity diagram for the Mood Check-In feature of the Balanga Kalinga system.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#111"/></marker><style>
      .shape{fill:#fff;stroke:#111;stroke-width:4}.arrow{fill:none;stroke:#111;stroke-width:4;marker-end:url(#arrow)}.line{fill:none;stroke:#111;stroke-width:4}
      .title{font:bold 31px Arial,sans-serif;fill:#111;text-anchor:middle}.subtitle{font:19px Arial,sans-serif;fill:#444;text-anchor:middle}
      .label{font:bold 27px Arial,sans-serif;fill:#111;text-anchor:middle}.small{font:22px Arial,sans-serif;fill:#111;text-anchor:middle}.note{font:21px Arial,sans-serif;fill:#111}.caption{font:italic 23px Arial,sans-serif;fill:#111;text-anchor:middle}
    </style></defs>
<rect width="1600" height="2020" fill="#fff"/>
<text x="800" y="55" class="title">Balanga Kalinga — Mood Check-In</text>
<text x="800" y="86" class="subtitle">Feature 3 — Record a mood and optional personal note</text>
<circle cx="800" cy="140" r="24" fill="#111"/>
<path d="M800 164 V210" class="arrow"/>
<rect x="570" y="210" width="460" height="78" class="shape"/><text x="800" y="257" class="label">Log In</text>
<path d="M800 288 V330" class="arrow"/>
<path d="M800 330 L1010 397.5 L800 465 L590 397.5 Z" class="shape"/><text x="800" y="390.5" class="label">Credentials</text><text x="800" y="420.5" class="label">valid?</text>
<path d="M1010 397 H1190 V249 H1030" class="arrow"/>
<text x="1080" y="380" class="note">No</text>
<path d="M800 465 V500" class="arrow"/>
<text x="820" y="482" class="note">Yes</text>
<rect x="500" y="500" width="600" height="80" class="shape"/><text x="800" y="548" class="label">Open Balanga Kalinga Dashboard</text>
<path d="M800 580 V635" class="arrow"/>
<rect x="540" y="635" width="520" height="82" class="shape"/><text x="800" y="684" class="label">Open Mood Check-In</text>
<path d="M800 717 V770" class="arrow"/>
<rect x="480" y="770" width="640" height="82" class="shape"/><text x="800" y="819" class="label">Select Mood from the List</text>
<path d="M800 852 V905" class="arrow"/>
<path d="M800 905 L1010 972.5 L800 1040 L590 972.5 Z" class="shape"/><text x="800" y="980.5" class="label">Mood selected?</text>
<path d="M590 972 H350 V811 H480" class="arrow"/>
<text x="415" y="954" class="note">No</text>
<path d="M800 1040 V1090" class="arrow"/>
<text x="820" y="1073" class="note">Yes</text>
<path d="M800 1090 L1010 1157.5 L800 1225 L590 1157.5 Z" class="shape"/><text x="800" y="1150.5" class="label">Add a personal</text><text x="800" y="1180.5" class="label">note?</text>
<path d="M590 1157 H300 V1331 H500" class="arrow"/>
<text x="400" y="1139" class="note">Yes</text>
<rect x="500" y="1290" width="600" height="82" class="shape"/><text x="800" y="1339" class="label">Type Short Note</text>
<path d="M1010 1157 H1180 V1405 H800" class="line"/>
<text x="1035" y="1139" class="note">No</text>
<path d="M800 1372 V1430" class="arrow"/>
<rect x="500" y="1430" width="600" height="82" class="shape"/><text x="800" y="1479" class="label">Save Mood Check-In</text>
<path d="M800 1512 V1555" class="arrow"/>
<rect x="540" y="1555" width="520" height="82" class="shape"/><text x="800" y="1604" class="label">Show Saved Confirmation</text>
<path d="M800 1637 V1685" class="arrow"/>
<rect x="620" y="1685" width="360" height="78" class="shape"/><text x="800" y="1732" class="label">Log Out</text>
<path d="M800 1763 V1806" class="arrow"/>
<circle cx="800" cy="1830" r="24" fill="#111"/>
<text x="800" y="1980" class="caption">Figure X. Activity Diagram for Mood Check-In</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2020" viewBox="0 0 1600 2020" role="img" aria-labelledby="title desc">
<title id="title">AI Wellness Chat activity diagram</title>
<desc id="desc">Activity diagram for the AI Wellness Chat feature of the Balanga Kalinga system.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#111"/></marker><style>
      .shape{fill:#fff;stroke:#111;stroke-width:4}.arrow{fill:none;stroke:#111;stroke-width:4;marker-end:url(#arrow)}.line{fill:none;stroke:#111;stroke-width:4}
      .title{font:bold 31px Arial,sans-serif;fill:#111;text-anchor:middle}.subtitle{font:19px Arial,sans-serif;fill:#444;text-anchor:middle}
      .label{font:bold 27px Arial,sans-serif;fill:#111;text-anchor:middle}.small{font:22px Arial,sans-serif;fill:#111;text-anchor:middle}.note{font:21px Arial,sans-serif;fill:#111}.caption{font:italic 23px Arial,sans-serif;fill:#111;text-anchor:middle}
    </style></defs>
<rect width="1600" height="2020" fill="#fff"/>
<text x="800" y="55" class="title">Balanga Kalinga — AI Wellness Chat</text>
<text x="800" y="86" class="subtitle">Feature 4 — Exchange mental-health and wellbeing messages with Kalinga AI</text>
<circle cx="800" cy="140" r="24" fill="#111"/>
<path d="M800 164 V210" class="arrow"/>
<rect x="570" y="210" width="460" height="78" class="shape"/><text x="800" y="257" class="label">Log In</text>
<path d="M800 288 V330" class="arrow"/>
<path d="M800 330 L1010 397.5 L800 465 L590 397.5 Z" class="shape"/><text x="800" y="390.5" class="label">Credentials</text><text x="800" y="420.5" class="label">valid?</text>
<path d="M1010 397 H1190 V249 H1030" class="arrow"/>
<text x="1080" y="380" class="note">No</text>
<path d="M800 465 V500" class="arrow"/>
<text x="820" y="482" class="note">Yes</text>
<rect x="500" y="500" width="600" height="80" class="shape"/><text x="800" y="548" class="label">Open Balanga Kalinga Dashboard</text>
<path d="M800 580 V635" class="arrow"/>
<rect x="540" y="635" width="520" height="82" class="shape"/><text x="800" y="684" class="label">Open AI Wellness Chat</text>
<path d="M800 717 V770" class="arrow"/>
<rect x="500" y="770" width="600" height="82" class="shape"/><text x="800" y="819" class="label">Enter and Send Message</text>
<path d="M800 852 V905" class="arrow"/>
<path d="M800 905 L1010 972.5 L800 1040 L590 972.5 Z" class="shape"/><text x="800" y="965.5" class="label">Mental-health or</text><text x="800" y="995.5" class="label">wellbeing topic?</text>
<path d="M590 972 H220 V1100 H420" class="arrow"/>
<text x="290" y="954" class="note">No</text>
<rect x="120" y="1100" width="600" height="82" class="shape"/><text x="420" y="1149" class="label">Show Fixed Out-of-Scope Reply</text>
<path d="M800 1040 V1100" class="arrow"/>
<text x="820" y="1082" class="note">Yes</text>
<rect x="880" y="1100" width="600" height="82" class="shape"/><text x="1180" y="1149" class="label">Generate Supportive AI Reply</text>
<path d="M420 1182 V1240 H1180 M1180 1182 V1240" class="line"/>
<path d="M800 1240 V1270" class="arrow"/>
<rect x="460" y="1270" width="680" height="82" class="shape"/><text x="800" y="1319" class="label">Save Conversation and Message Records</text>
<path d="M800 1352 V1405" class="arrow"/>
<path d="M800 1405 L1010 1472.5 L800 1540 L590 1472.5 Z" class="shape"/><text x="800" y="1465.5" class="label">Continue</text><text x="800" y="1495.5" class="label">chatting?</text>
<path d="M1010 1472 H1250 V811 H1100" class="arrow"/>
<text x="1090" y="1455" class="note">Yes</text>
<path d="M800 1540 V1600" class="arrow"/>
<text x="820" y="1580" class="note">No</text>
<rect x="620" y="1600" width="360" height="78" class="shape"/><text x="800" y="1647" class="label">Log Out</text>
<path d="M800 1678 V1816" class="arrow"/>
<circle cx="800" cy="1840" r="24" fill="#111"/>
<text x="800" y="1980" class="caption">Figure X. Activity Diagram for AI Wellness Chat</text></svg>